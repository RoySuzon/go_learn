version: '3.8'

services:
  # PostgreSQL Database Container Service
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: godb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go REST API Container Service
  go-rest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_rest_api_service
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_DSN=host=postgres_db user=postgres password=postgrespassword dbname=godb port=5432 sslmode=disable
      - PORT=8080
      - ENV=production
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
